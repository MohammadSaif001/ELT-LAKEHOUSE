generation:
  years : [2025,2026]
  cutoff : "2026-06-21T13:30:00"
  cutoff_step_days : 364
  day_of_month : [1,28]

order_status:
  approved_or_later: ["approved","processing","invoiced","shipped", "delivered"]
  shipped_or_later: ["shipped", "delivered"]
  delivered: ["delivered"]


delay_models:
  approved_delay:
    lognormal_mu : 1.35
    lognormal_sigma : 1.5
    min_hours : 1
    max_hours : 720

payments:
  single_installment_types : ["boleto","voucher","debit_card"]
  fallback_total_value : 20.0

pool_size:
  customers : 10000
  products : 10000
  sellers : 2000

dataset_volume:
    orders: 8000
  
product_dimensions:
    min_value: 1

location_defaults:
  fallback_zip : ["01000"]
  fallback_cordinates:
    lat : -23.5505
    long : -46.6333
  jitter_degrees : 0.02

reviews:
  positive_score_threshold: 4
  neutral_score: 3
  creation_delay_days: [1, 3]
  answer_delay_days: [1, 4]
  templates:
      positive:
        - title: "Great purchase"
          message: "Product arrived on time and quality was excellent."
        - title: "Excellent seller"
          message: "Everything arrived as expected."
      negative:
        - title: "Poor experience"
          message: "Delivery was delayed and product quality was poor."
        - title: "Disappointed"
          message: "Item was different from the description."
      neutral:
        - title: "Average experience"
          message: "Product is okay"
        - title: "Expected better"
          message: "Nothing special"