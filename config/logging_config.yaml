version: 1

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/application.log
    encoding: utf-8
    maxBytes: 10485760 # 10MB
    backupCount: 5

root:
  level: INFO
  handlers:
    - console
    - file
