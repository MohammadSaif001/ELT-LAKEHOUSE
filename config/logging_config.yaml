version: 1

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  colored_console:
    (): src.elt_lakehouse.spark.common.logger.ColorFormatter
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: colored_console
    stream: ext://sys.stderr

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/application.log
    encoding: utf-8
    maxBytes: 10485760 # 10MB
    backupCount: 5

  dashboard_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/dashboard.log
    encoding: utf-8
    maxBytes: 5242880 # 5MB
    backupCount: 3

loggers:
  # The dashboard reads logs/application.log, so its own messages go to a
  # separate file and never propagate into the pipeline log.
  dashboard:
    level: INFO
    handlers:
      - console
      - dashboard_file
    propagate: false

root:
  level: INFO
  handlers:
    - console
    - file
