version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests: [not_null, unique]

  - name: dim_seller
    columns:
      - name: seller_key
        data_tests: [not_null, unique]
      - name: seller_id
        data_tests: [not_null, unique]

  - name: dim_product
    columns:
      - name: product_key
        data_tests: [not_null, unique]
      - name: product_id
        data_tests: [not_null, unique]

  - name: dim_location
    columns:
      - name: zip_code_prefix
        data_tests: [not_null, unique]

  - name: dim_date
    columns:
      - name: date_key
        data_tests: [not_null, unique]
      - name: date
        data_tests: [not_null, unique]

  - name: dim_review
    columns:
      - name: review_id
        data_tests: [not_null, unique]

  - name: fact_order_items
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: order_item_id
        data_tests: [not_null]
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: seller_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: purchase_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: approved_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: carrier_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: delivered_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: estimated_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_seller
    columns:
      - name: seller_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_key
      - name: month
        data_tests: [not_null]

  - name: fact_product
    columns:
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: month
        data_tests: [not_null]
