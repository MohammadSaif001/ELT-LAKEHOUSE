name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  import-smoke-test:
    name: Import Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install pytest

      - name: Import all core modules
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import sys

          PACKAGES = ["config", "spark", "ingestion"]
          failures = []

          for package_name in PACKAGES:
              try:
                  package = importlib.import_module(package_name)
              except Exception as exc:
                  failures.append(f"{package_name}: {exc!r}")
                  continue

              for _, module_name, _ in pkgutil.walk_packages(
                  package.__path__,
                  prefix=f"{package_name}."
              ):
                  try:
                      importlib.import_module(module_name)
                  except Exception as exc:
                      failures.append(f"{module_name}: {exc!r}")

          if failures:
              print("Import failures:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)

          print(f"All modules in {PACKAGES} imported successfully.")
          PY

  test:
    name: Data Quality & Unit Tests
    runs-on: ubuntu-latest
    needs: import-smoke-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install pytest

      - name: Run test suite
        run: |
          pytest -v