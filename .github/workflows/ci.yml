---
jobs:
  import-smoke-test:
    name: Import Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          cache: pip
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install -e .
          pip install pytest

      - name: Import all core modules
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/src"
          python - <<'PY'
          import importlib
          import pkgutil
          import sys

          PACKAGES = ["config", "elt_lakehouse.spark", "elt_lakehouse.ingestion"]
          failures = []

          for package_name in PACKAGES:
              try:
                  package = importlib.import_module(package_name)
              except Exception as exc:
                  failures.append(f"{package_name}: {exc!r}")
                  continue

              for _, module_name, _ in pkgutil.walk_packages(
                  package.__path__,
                  prefix=f"{package_name}."
              ):
                  try:
                      importlib.import_module(module_name)
                  except Exception as exc:
                      failures.append(f"{module_name}: {exc!r}")

          if failures:
              print("Import failures:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)

          print(f"All modules in {PACKAGES} imported successfully.")
          PY
  test:
    name: Data Quality & Unit Tests
    needs: import-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          cache: pip
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install -e .
          pip install pytest

      - name: Run test suite
        run: |
          pytest -v
name: CI
"on":
  pull_request:
    branches:
      - main
      - "**"
  push:
    branches:
      - main
      - "**"
