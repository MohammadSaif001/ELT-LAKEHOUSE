name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main
      - "**"

jobs:
  import-smoke-test:
    name: Import Smoke Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Import core modules
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/src"
          python - <<'PY'
          import importlib
          import pkgutil
          import sys

          packages = [
              "config",
              "elt_lakehouse.spark",
              "elt_lakehouse.ingestion",
          ]

          failures = []

          for package_name in packages:
              try:
                  package = importlib.import_module(package_name)
              except Exception as exc:
                  failures.append(f"{package_name}: {exc!r}")
                  continue

              if hasattr(package, "__path__"):
                  for _, module_name, _ in pkgutil.walk_packages(
                      package.__path__,
                      prefix=f"{package_name}.",
                  ):
                      try:
                          importlib.import_module(module_name)
                      except Exception as exc:
                          failures.append(f"{module_name}: {exc!r}")

          if failures:
              print("Import failures:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)

          print("Core module import check completed.")
          PY

  test:
    name: Data Quality and Unit Tests (Python ${{ matrix.python-version }})
    needs: import-smoke-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Java for Spark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate test pools
        run: python elt_pipeline.py --build-pool

      - name: Generate test datasets
        run: python elt_pipeline.py --build-dataset

      - name: Run tests
        run: python -m pytest -v
