[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elt-lakehouse"
version = "0.1.0"
requires-python = ">=3.10"
description = "ELT Lakehouse data engineering project"

dependencies = [
    "delta-spark",
    "pyspark",
    "pyyaml",
    "pytest",
    "flask>=3.1.3",
    "dotenv>=0.9.9",
    "kaggle>=1.7.4.5",
    "pyarrow>=25.0.1",
]
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["elt_lakehouse*"]
