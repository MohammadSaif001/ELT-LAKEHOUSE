[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elt-lakehouse"
version = "0.1.0"
requires-python = "3.14"
description = "ELT Lakehouse data engineering project"

dependencies = [
    "delta-spark",
    "pyspark",
    "pyyaml",
    "pytest",
    "dotenv>=0.9.9",
    "kaggle>=1.7.4.5",
    "pyarrow>=25.0.1",
    "fastapi[standard]>=0.141.1",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "dbt-spark[session]",
]
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["elt_lakehouse*"]
